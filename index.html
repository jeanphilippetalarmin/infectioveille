function escapeHTML(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function validURL(v){try{const u=new URL(v);return ["http:","https:"].includes(u.protocol)?u.href:"";}catch(e){return "";}}
function link(url,text,cls="external"){
 const u=validURL(url);return u?`<a href="${escapeHTML(u)}" class="${cls}" target="_blank" rel="noopener noreferrer">${escapeHTML(text)} ↗</a>`:`<span class="subtle">Lien : À compléter</span>`;
}
function fmtDate(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso||"")))return escapeHTML(iso||"À compléter");const d=new Date(iso+"T12:00:00");return Number.isNaN(d.valueOf())?escapeHTML(iso):new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short",year:"numeric"}).format(d);}
function fmtShort(iso){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso||"")))return "À compléter";const d=new Date(iso+"T12:00:00");return new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"long"}).format(d);}
function countdown(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(String(date||"")))return "Date à compléter";const t=new Date(date+"T12:00:00").getTime();const today=new Date();today.setHours(12,0,0,0);const days=Math.round((t-today.getTime())/86400000);return days>0?`J−${days}`:days===0?"Aujourd’hui":`Passé (${Math.abs(days)} j)`;}
function normalize(str){return String(str||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();}
function matches(obj,q=query){if(!q)return true;const visible={...obj};delete visible.impact_pratique;delete visible.message_cle;return normalize(Object.values(visible).map(v=>typeof v==="object"?JSON.stringify(v):v).join(" ")).includes(normalize(q));}

/* Notice bibliographique : afficher la référence, pas le fournisseur PubMed. */
function biblioMeta(item){
 const auteur=item.auteur||"Auteur à compléter",revue=item.revue_abregee||item.revue||"Revue à compléter";
 let reference=item.reference||`${auteur} · ${revue} · ${(item.date||"").slice(0,4)}`;
 // Les données anciennes restent compatibles même sans référence structurée.
 if(/^Europe PMC \/ PubMed/i.test(reference))reference=`${auteur} · ${revue}`;
 const dated=item.date?`<span class="meta-date">Publié le ${fmtDate(item.date)}</span>`:"";
 const doi=item.doi?` · DOI : ${escapeHTML(item.doi)}`:"";
 return `<div class="meta"><span><strong>${escapeHTML(reference)}</strong>${doi} ${dated}</span>${link(item.lien,"Consulter la source")}</div>`;
}

function isRelevantAutomatic(item){
 if(!String(item.id||"").startsWith("auto-pmid-"))return true;
 const title=String(item.titre||"");
 if(/\breddit\b|\bchatbot\b|\bpyruvate kinase\b|fungal metabolite|mouse infection model|murine model|\btransgenic\b|plasmodium berghei|plasmodium yoelii|\bpenguins?\b|\bseabirds?\b|\bwildlife\b|\bveterinar|animal husbandry|\baquaculture\b|\blivestock\b|\bmarine environment\b|\benvironmental (?:fungi|mycobiome|samples)\b|\bpreclinical\b/i.test(title))return false;
 if(/(?:this review aims to|cette revue vise à|gestion de la candidature)/i.test(String(item.resume||"")) && String(item.resume||"").length<260)return false;
 return /infect|bacter|staphylococc|endocard|sepsis|antibio|antimicrob|antifungal|fungal|aspergill|candid|mycos|mucor|cryptococc|nocardi|pneumon|influenza|respiratory syncytial|\brsv\b|\bhiv\b|aids|prep|hepatit|tubercul|mycobacteri|syphilis|gonorr|chlamydia|mpox|dengue|chikungunya|west nile|malaria|plasmodium|clostridioid|osteomyelit|prosthetic joint|bloodstream|catheter.related infection|vaccin|immuni[sz]ation|tularem|brucell|leptospir|zoonos|resistan|prophylax|urinary tract/i.test(title);
}
function publicationMatchesPath(p,path){
 if(!isRelevantAutomatic(p))return false;
 if(Array.isArray(p.thematiques)&&p.thematiques.length)return p.thematiques.includes(path.id);
 const title=String(p.titre||""), body=title+" "+String(p.pathologie||"");
 if(path.id==="immuno")return /neutropeni|haematolog|hematolog|leukemi|leukaemi|stem.cell|transplant|immunocompromis|immunosuppress|venetoclax|oncolog/i.test(body)
   && /infect|bacter|sepsis|fungal|aspergill|candid|antifungal|antibiotic|antimicrob|prophylax|pneumon|virus|vaccin/i.test(title);
 const pattern=THEME_FALLBACK[path.id];
 if(pattern?.test(title))return true;
 // Données sélectionnées manuellement : mapping hérité, sauf chez l'immunodéprimé
 // où les identifiants initiaux associaient des articles hors thème.
 return Boolean(path.id!=="immuno" && (path.publications||[]).includes(p.id) && !String(p.id||"").startsWith("auto-"));
}

function pathCard(p){const rules=(p.recommandations||[]).map(r=>`<li>${link(r.lien,r.organisme)} · ${escapeHTML(r.annee||"À compléter")}</li>`).join("");const pubs=pathPublications(p).map(x=>`<li>${link(x.lien,x.titre)} <span class="subtle">— ${escapeHTML(x.auteur||"Auteur à compléter")} · ${escapeHTML(x.revue_abregee||x.revue||"Revue à compléter")} · ${fmtDate(x.date)}</span></li>`).join("");const other=(p.liens||[]).map(x=>`<li>${link(x.lien,x.nom)}</li>`).join("");return `<article class="card path-card"><details data-path="${escapeHTML(p.id)}"><summary><div><h3>${escapeHTML(p.nom)}</h3><span class="subtle">Recommandations · Publications · Vigilances · Notes</span></div><div class="action-row">${favBtn("h",p.id)}<span class="subtle" aria-hidden="true">⌄</span></div></summary><div class="path-body"><h4>Recommandations et statut documentaire</h4><ul>${rules||"<li>À compléter</li>"}</ul><h4>Publications récentes identifiées</h4>${pubs?`<ul>${pubs}</ul>`:`<p class="subtle">Aucune publication infectiologique récente retenue pour ce thème. Les recherches sont actualisées quotidiennement ; cette fiche peut rester vide si aucun article ne passe les filtres.</p>`}<h4>Points de vigilance</h4><ul>${p.vigilance.map(v=>`<li>${escapeHTML(v)}</li>`).join("")}</ul><h4>Liens utiles</h4><ul>${other}</ul><h4>Note personnelle (stockée sur cet appareil)</h4><textarea class="note" data-note="${escapeHTML(p.id)}" spellcheck="true" placeholder="Observations, protocole local, points à vérifier…">${escapeHTML(persistent.notes[p.id]||"")}</textarea><div class="note-status">Saisie enregistrée localement quand le navigateur l’autorise. Aucune transmission externe.</div></div></details></article>`;}

 const monitored=suivi.length?`<div class="section-title"><h2>Surveillance automatique des référentiels</h2><small>${suivi.length} sites configurés</small></div><div class="alertbar">Contrôle des listes de liens des pages officielles. Une modification signalée n'établit ni qu'une recommandation est nouvelle ni qu'elle s'applique en France. Les pages inaccessibles sont indiquées.</div><div class="grid">${suivi.map(x=>`<article class="card"><h3>${escapeHTML(x.nom)}</h3><p class="subtle">${escapeHTML(x.statut||"Contrôle à effectuer")}</p><p class="subtle">Dernier contrôle réussi : ${fmtDate(x.dernier_controle||"")}${x.dernier_changement?" · Modification détectée : "+fmtDate(x.dernier_changement):""}</p>${link(x.lien,"Catalogue officiel")}</article>`).join("")}</div>`:

function importerBox(){return `<section class="jsonbox no-print" id="importPanel"><h3 style="margin:0 0 5px">Importer une veille JSON</h3><p class="subtle">Collez un objet JSON (pas un bloc Markdown). Une nouvelle période archive automatiquement l'ancienne. Les actualités de même identifiant sont dédupliquées. Les données sont enregistrées uniquement sur cet appareil.</p><textarea id="jsonPaste" aria-label="JSON à importer" placeholder='{ "semaine": "2026-10-26", "messages_cles": ["..."], "nouveautes": [], "alertes": [], "congres": [] }'></textarea><div class="toolbar"><button class="btn btn-primary" id="confirmImport">Vérifier et importer</button><button class="btn" id="closeImporter">Annuler</button><button class="btn" id="downloadExample">Voir le format JSON</button></div><div id="importStatus" class="status" role="status" aria-live="polite"></div></section>`;}
function emploiView(){return titleBlock("Maintenance simple","Mode d'emploi","En ligne : collecte documentaire automatique par GitHub Actions et historique hebdomadaire. Hors ligne : édition embarquée.")+`<div class="grid"><section class="card"><h3>Actualisation quotidienne</h3><p>La collecte quotidienne utilise une recherche Europe PMC / PubMed sur 45 jours, des flux ECDC et Santé publique France, et surveille les index des recommandations SPILF, HAS, IDSA, ESCMID, ECIL, ECMM, ISHAM, BHIVA et d'autres sociétés. Les changements d'index ne sont jamais présentés comme une nouvelle recommandation confirmée.</p><p>Le lundi, une nouvelle semaine est ouverte et la précédente est archivée. Les autres jours, les références absentes des archives et de la bibliographie sont recherchées et ajoutées ; la déduplication utilise PMID et titre. Les références publiées plus tôt mais nouvellement détectées sont identifiées par leur date de publication et leur date de détection.</p><p><strong>Limite :</strong> la sélection automatique est documentaire, <strong>non une analyse critique</strong> des articles ni une analyse de leur texte intégral. Aucune conséquence pratique automatique n'est affichée : seule une synthèse clinique validée éditorialement peut être ajoutée à une fiche. Les recommandations non diffusées en RSS et les dates d’abstract restent à vérifier.</p><p class="fine-print">En cas de panne des sources, l’ancienne édition reste visible et un avertissement est enregistré. Les exécutions programmées peuvent être retardées ou suspendues par GitHub.</p></section><section class="card"><h3>Précautions</h3><p>Ne jamais saisir de données nominatives de patients dans les notes ni dans une veille destinée à être partagée. Les notes sont locales et <strong>non chiffrées</strong>.</p><p>Les favoris et notes sont propres au navigateur de chaque visiteur. Ils ne sont jamais publiés sur le site partagé. Leur sauvegarde se fait par export JSON.</p><p>Une étude résumée ne remplace pas l’analyse critique de l’article complet, et la date d’une page peut différer de celle du travail original.</p></section></div><div class="section-title"><h2>Prompt de mise à jour du lundi</h2><button class="btn no-print" id="copyPrompt">⎘ Copier</button></div><div class="prompt" id="promptText">${escapeHTML(PROMPT_HEBDO)}</div><p class="subtle">L’import manuel ne modifie que ce navigateur : <strong>il ne publie rien pour les autres visiteurs</strong> et la prochaine synchronisation depuis le site public est prioritaire. Pour améliorer la robustesse de l'import, utilisez des champs identiques à ceux de l'exemple téléchargeable. L'import rejette les actus sans source, date, URL HTTP(S) ou résumé. Un champ « À compléter » n'est admis que dans les rubriques facultatives.</p><div class="section-title"><h2>Import, sauvegarde et restauration</h2></div><div class="toolbar no-print"><button class="btn btn-primary" id="openImporter">⇪ Importer la veille</button><button class="btn" id="exportBtn">⇩ Exporter mes données</button><button class="btn" id="restoreBtn">⇧ Restaurer une sauvegarde</button><input type="file" id="restoreFile" accept=".json,application/json" class="screen-reader"></div>${importOpen?importerBox():""}<div class="section-title"><h2>Périmètre et transparence</h2></div><div class="callout">Collecte manuelle initiale : <strong>22 octobre 2026</strong>, portant prioritairement sur les 7 derniers jours et des documents remarquables des trois mois précédents. Sources effectivement ouvertes : Santé publique France, ECDC, OMS, IDSA, SPILF, SF2H, HAS, CID, OFID, PubMed, NEJM (page éditoriale), pages officielles des congrès. Plusieurs revues demandées n’ont pas fourni d’article sélectionné vérifié dans cette collecte ; cela ne signifie pas qu’elles n’ont rien publié.</div><div class="callout">À compléter : revue exhaustive de NEJM, Lancet, Lancet Infectious Diseases, CMI, JAC, JID, IDN, Eurosurveillance et MMWR ; lecture intégrale des essais non accessibles ; dates de certains appels à abstracts ; vérification systématique de l’année et des versions de tous les référentiels thématiques ; synthèses de congrès et enrichissement des fiches. Les résultats non corroborés ne sont pas ajoutés.</div><div class="divider"></div><h3>Référence des champs de l’actualité</h3><pre class="prompt" style="font-size:11px">${escapeHTML(JSON.stringify({date:"AAAA-MM-JJ",titre:"",resume:"",niveau_impact:2,categorie:"Publication",pathologie:"",source:"",lien:"https://...",changement_pratique:"Facultatif, après vérification",validation_clinique:"validee (validation humaine uniquement)"},null,2))}</pre><p class="fine-print">Le fichier HTML reste utilisable hors ligne, mais les mises à jour publiques nécessitent un hébergement et data/veille.json. Les données locales peuvent être soumises aux restrictions du navigateur (file://). Pour une sauvegarde durable, utilisez « Exporter mes données ». L’import se fait sans exécution de code et les valeurs sont échappées lors de l'affichage.</p>`;}
function searchView(){const q=query.trim(),parts=[];const add=(title,arr,make,max=50)=>{const m=arr.filter(x=>matches(x,q)).slice(0,max);if(m.length)parts.push(`<div class="section-title"><h2>${escapeHTML(title)}</h2><small>${m.length} résultat(s) affiché(s)</small></div><div class="grid">${m.map(make).join("")}</div>`);};add("Nouveautés",editorial.nouvautes.nouveautes.filter(isRelevantAutomatic),x=>newsCard(x,"n"));add("Archives",editorial.archives.flatMap(x=>(x.nouveautes||[]).filter(isRelevantAutomatic)),x=>newsCard(x,"n"));add("Pathologies",PATHOLOGIES,pathCard);add("Publications",editorial.publications.filter(isRelevantAutomatic),publicationCard);add("Congrès",editorial.congres,congressCard);add("Sociétés savantes",SOCIETES,x=>societyCard(x));add("Alertes",editorial.alertes,alertCard);add("Outils",OUTILS,x=>societyCard(x,"o"));return titleBlock("Recherche transversale",`Résultats pour « ${q} »`,"Recherche en temps réel dans l'ensemble des rubriques, y compris les archives.")+(parts.join("")||emptyView("Aucun résultat"));}

/* Vérification de forme de la mise à jour : rejet des entrées sans traçabilité. */
function isDate(x){if(typeof x!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(x))return false;const d=new Date(x+"T12:00:00Z");return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===x;}
function requireStr(x,label){if(typeof x!=="string"||!x.trim()||x.trim()==="À compléter")throw new Error(`Champ obligatoire absent ou non vérifié : ${label}`);return x.trim();}
function slug(s){return normalize(s).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60)||"entree";}
function validateNews(a){if(!a||typeof a!=="object"||Array.isArray(a))throw new Error("Actualité invalide.");const o={};for(const key of ["date","titre","resume","categorie","pathologie","source","lien"])o[key]=requireStr(a[key],"nouveautes."+key);if(!isDate(o.date))throw new Error("Date d'actualité invalide : "+o.date);if(!validURL(o.lien))throw new Error("URL d'actualité invalide : "+o.titre);if(a.niveau_impact!==undefined){const n=Number(a.niveau_impact);if(![1,2,3].includes(n))throw new Error("niveau_impact doit être 1, 2 ou 3.");o.niveau_impact=n;}if(typeof a.statut==="string")o.statut=a.statut.slice(0,140);if(typeof a.changement_pratique==="string")o.changement_pratique=a.changement_pratique.slice(0,1200);if(a.validation_clinique==="validee")o.validation_clinique="validee";o.id=typeof a.id==="string"&&a.id.trim()?a.id.trim():"n-"+o.date+"-"+slug(o.titre);return o;}
function validateAlert(a){if(!a||typeof a!=="object"||Array.isArray(a))throw new Error("Alerte invalide.");const o={};for(const k of ["titre","zone","niveau","date","resume","source","lien"])o[k]=requireStr(a[k],"alertes."+k);if(!isDate(o.date)||!validURL(o.lien))throw new Error("Date ou lien invalide pour l'alerte : "+o.titre);o.id=typeof a.id==="string"&&a.id.trim()?a.id.trim():"al-"+o.date+"-"+slug(o.titre);return o;}
function validateCongress(a){if(!a||typeof a!=="object"||Array.isArray(a))throw new Error("Congrès invalide.");const o={};for(const k of ["nom","debut","fin","ville","source","lien"])o[k]=requireStr(a[k],"congres."+k);if(!isDate(o.debut)||!isDate(o.fin)||o.fin<o.debut||!validURL(o.lien))throw new Error("Dates ou lien invalide pour : "+o.nom);o.abstract=typeof a.abstract==="string"&&isDate(a.abstract)?a.abstract:"À compléter";if(a.late!==undefined)o.late=isDate(a.late)?a.late:"À compléter";o.id=typeof a.id==="string"&&a.id.trim()?a.id.trim():"c-"+slug(o.nom);return o;}
function mergeById(oldItems,newItems){const map=new Map();(oldItems||[]).forEach(x=>{if(x&&x.id)map.set(x.id,x);});newItems.forEach(x=>map.set(x.id,x));return [...map.values()];}
function importWeekly(raw){let j;try{j=JSON.parse(raw);}catch(e){throw new Error("Le texte n’est pas un JSON valide. Retirez éventuellement les balises ```json.");}
 if(!j||typeof j!=="object"||Array.isArray(j))throw new Error("Le document doit être un objet JSON.");
 if(!isDate(j.semaine))throw new Error("« semaine » doit être une date AAAA-MM-JJ valide (lundi recommandé).");
 if(!Array.isArray(j.nouveautes)||j.nouveautes.length===0)throw new Error("Au moins une nouveauté sourcée est nécessaire.");
 if(j.nouveautes.length>100)throw new Error("Import limité à 100 nouveautés par lot.");
 if(!Array.isArray(j.messages_cles)||j.messages_cles.some(x=>typeof x!=="string"))throw new Error("« messages_cles » doit être une liste de textes.");
 if(j.alertes!=null&&!Array.isArray(j.alertes))throw new Error("« alertes » doit être une liste.");
 if(j.congres!=null&&!Array.isArray(j.congres))throw new Error("« congres » doit être une liste.");
 const newNews=j.nouveautes.map(validateNews),newAlerts=(j.alertes||[]).map(validateAlert),newCongress=(j.congres||[]).map(validateCongress);
 const start=new Date(j.semaine+"T12:00:00Z");start.setUTCDate(start.getUTCDate()+6);const end=start.toISOString().slice(0,10);
 const today=new Date(),updated=[today.getFullYear(),String(today.getMonth()+1).padStart(2,"0"),String(today.getDate()).padStart(2,"0")].join("-");
 const ed=clone(editorial),different=ed.nouvautes.semaine!==j.semaine;
 if(different){ed.archives=[ed.nouvautes,...ed.archives.filter(x=>x.semaine!==ed.nouvautes.semaine&&x.semaine!==j.semaine)];ed.nouvautes={semaine:j.semaine,fin:end,maj:updated,messages_cles:j.messages_cles.slice(0,3),nouveautes:newNews};}
 else{ed.nouvautes.nouveautes=mergeById(ed.nouvautes.nouveautes,newNews);ed.nouvautes.messages_cles=j.messages_cles.length?j.messages_cles.slice(0,3):ed.nouvautes.messages_cles;ed.nouvautes.maj=updated;}
 ed.alertes=mergeById(ed.alertes,newAlerts);ed.congres=mergeById(ed.congres,newCongress);
 editorial=ed;persist();return `Import réussi : ${newNews.length} actualité(s), ${newAlerts.length} alerte(s), ${newCongress.length} congrès. ${different?"La période précédente a été archivée.":"Période existante enrichie."}`;
}
function saveFile(obj,name){const blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json;charset=utf-8"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2500);}
function exportAll(){saveFile({format:"InfectioVeille-sauvegarde-v1",date_export:new Date().toISOString(),favoris:persistent.favoris,notes:persistent.notes,theme:persistent.theme,editorial},"infectioveille-sauvegarde-"+new Date().toISOString().slice(0,10)+".json");}
function restoreBackup(txt){let data;try{data=JSON.parse(txt);}catch(e){throw new Error("Sauvegarde illisible : JSON invalide.");}if(!data||data.format!=="InfectioVeille-sauvegarde-v1"||!Array.isArray(data.favoris)||!data.notes||typeof data.notes!=="object"||!data.editorial||!data.editorial.nouvautes)throw new Error("Format de sauvegarde non reconnu.");
 if(!confirm("Restaurer cette sauvegarde ? Cela remplacera les favoris, les notes et les mises à jour présents sur cet appareil."))return false;
 persistent.favoris=data.favoris.filter(x=>typeof x==="string");persistent.notes=Object.fromEntries(Object.entries(data.notes).filter(([k,v])=>typeof k==="string"&&typeof v==="string"));persistent.theme=data.theme==="dark"?"dark":"light";
 editorial={...clone(BASE),...data.editorial};persist();query="";el("globalSearch").value="";active="emploi";render();return true;
}
function copyText(text,button){const original=button.textContent;const done=()=>{button.textContent="✓ Copié";setTimeout(()=>button.textContent=original,1800);};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done).catch(()=>copyFallback(text,done));}else copyFallback(text,done);}
function copyFallback(text,done){const ta=document.createElement("textarea");ta.value=text;ta.style.cssText="position:fixed;left:-9999px;top:0";document.body.appendChild(ta);ta.select();let worked=false;try{worked=document.execCommand("copy");}catch(e){}ta.remove();if(worked)done();else alert("Copie automatique indisponible dans ce navigateur. Sélectionnez le texte du prompt et copiez-le manuellement.");}
function applyRoute(){
 const hash=location.hash.slice(1), m=/^archives\/(\d{4}-\d{2}-\d{2})$/.exec(hash);
 active=m?"archives":NAV.some(x=>x[0]===hash)?hash:"semaine";
 selectedArchiveWeek=m?m[1]:"";
 query="";el("globalSearch").value="";render();
}
function switchTab(to){if(!NAV.some(a=>a[0]===to))return;
 if(location.hash!=="#"+to)location.hash=to;else applyRoute();
 window.scrollTo({top:0,behavior:"instant"});
}
function showImporter(){importOpen=true;if(query){query="";el("globalSearch").value="";}active="emploi";render();el("importPanel")?.scrollIntoView({behavior:"smooth",block:"start"});}
/* Événements délégués : évite de réenregistrer les listeners après chaque rendu. */
window.addEventListener("hashchange",applyRoute);
document.addEventListener("click",e=>{
 const target=e.target instanceof Element?e.target:null;if(!target)return;
 const favorite=target.closest("[data-fav]");if(favorite){e.preventDefault();e.stopPropagation();const k=favorite.dataset.fav;if(persistent.favoris.includes(k))persistent.favoris=persistent.favoris.filter(x=>x!==k);else persistent.favoris.push(k);persist();render();return;}
 const navigation=target.closest("[data-tab]");if(navigation){e.preventDefault();switchTab(navigation.dataset.tab);return;}
 const b=target.closest("button");if(!b)return;
 if(b.id==="themeBtn"){persistent.theme=persistent.theme==="light"?"dark":"light";persist();updateNav();return;}
 if(b.id==="importShortcut"||b.id==="openImporter"){showImporter();return;}
 if(b.id==="closeImporter"){importOpen=false;render();return;}
 if(b.id==="printWeek"){if(active!=="semaine"||query){switchTab("semaine");}window.requestAnimationFrame(()=>window.print());return;}
 if(b.id==="confirmImport"){const field=el("jsonPaste"),status=el("importStatus");try{const msg=importWeekly(field.value);importOpen=false;active="semaine";render();alert(msg);}catch(err){status.className="status error";status.textContent=err.message;}return;}
 if(b.id==="downloadExample"){el("jsonPaste").value=JSON.stringify({semaine:"2026-10-26",messages_cles:["Premier message","Deuxième message","Troisième message"],nouveautes:[{date:"2026-10-26",titre:"Titre vérifié",resume:"Résumé factuel sourcé, sans conclusion extrapolée",niveau_impact:2,categorie:"Publication",pathologie:"Tuberculose",source:"Organisme / revue",lien:"https://www.who.int/emergencies/disease-outbreak-news"}],alertes:[],congres:[]},null,2);return;}
 if(b.id==="exportBtn"){exportAll();return;}
 if(b.id==="copyPrompt"){copyText(PROMPT_HEBDO,b);return;}
 if(b.id==="restoreBtn"){el("restoreFile")?.click();return;}
});
document.addEventListener("input",e=>{if(e.target.matches("[data-note]")){const id=e.target.dataset.note;persistent.notes[id]=e.target.value;persist();}});
document.addEventListener("change",e=>{
 const id=e.target.id;
 if(id==="fJournal")pubFilters.revue=e.target.value;
 else if(id==="fPatho")pubFilters.pathologie=e.target.value;
 else if(id==="fType")pubFilters.type=e.target.value;
 else if(id==="fZone")alertFilter=e.target.value;
 else if(id==="restoreFile"){
   const file=e.target.files&&e.target.files[0];if(file){file.text().then(txt=>{try{restoreBackup(txt);}catch(err){alert(err.message);}}).catch(()=>alert("Impossible de lire le fichier."));}e.target.value="";return;
 }else return;
 render();
});
el("globalSearch").addEventListener("input",e=>{query=e.target.value;render();});
/* Chargement des éditions officielles de la version publique. En cas d'échec,
   le site reste lisible avec ses données intégrées et une mention visible. */
async function loadRemote(){
 if(!["http:","https:"].includes(location.protocol)){
   remoteStatus="Version locale (non synchronisée)";updateNav();return;
 }
 try{
  const response=await fetch("./data/veille.json?ts="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw new Error("HTTP "+response.status);
  const data=await response.json();
  if(!data||!data.nouvautes||!Array.isArray(data.nouvautes.nouveautes)||!Array.isArray(data.archives))throw new Error("Structure JSON invalide");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(data.nouvautes.semaine))throw new Error("Date de semaine incorrecte");
  const incoming={nouvautes:data.nouvautes,archives:data.archives};
  for(const key of ["publications","congres","alertes"])if(Array.isArray(data[key]))incoming[key]=data[key];
  if(typeof data.mode_synthese==="string")incoming.mode_synthese=data.mode_synthese;
  if(data.suivi_recommandations && typeof data.suivi_recommandations==="object")incoming.suivi_recommandations=data.suivi_recommandations;
  editorial={...clone(BASE),...incoming};
  remoteStatus=data.maj_auto?"Automatique · "+fmtDate(data.nouvautes.maj):"Édition initiale hébergée";
  if(data.mode_synthese?.includes('En attente'))remoteStatus+=' · Synthèses françaises non configurées';
  if(data.erreurs_sources?.length)remoteStatus+=" · sources partielles";
  render();
 }catch(e){remoteStatus="Source distante indisponible · version enregistrée";console.warn("Veille distante non chargée :",e);updateNav();}
}
applyRoute();
loadRemote();
if(["https:","http:"].includes(location.protocol))setInterval(loadRemote,15*60*1000);
</script>
