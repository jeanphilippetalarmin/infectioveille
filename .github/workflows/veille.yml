name: InfectioVeille – collecte et publication

on:
  push:
    branches: [main]
  schedule:
    # Tous les jours : 07:17 UTC (08:17 en hiver / 09:17 en été, Paris).
    # GitHub peut décaler une exécution planifiée.
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write   # Enregistrer l'édition et l'historique JSON dans le dépôt.
  pages: write      # Publier le site statique.
  id-token: write   # Authentification OIDC requise par GitHub Pages.

concurrency:
  group: infectioveille-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers du site
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter les nouvelles références (hors push initial)
        if: github.event_name != 'push'
        run: python scripts/update.py
      - name: Enregistrer la nouvelle édition et les archives
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/veille.json
          if ! git diff --cached --quiet; then
            git commit -m "Veille: collecte automatique $(date -u +%F)"
            git push origin HEAD:main
          else
            echo 'Aucune modification à enregistrer'
          fi
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer les fichiers publics
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/veille.json _site/data/veille.json
          touch _site/.nojekyll
      - name: Créer l'artefact GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4

