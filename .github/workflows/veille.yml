name: InfectioVeille – collecte et publication

on:
  push:
    branches: [main]
  schedule:
    # Déclenchement quotidien à 07:17 UTC (GitHub peut décaler l'exécution).
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: infectioveille-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-traduction.txt

      - name: Cache modèle Argos anglais-français
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: .argos-models
          key: infectioveille-argos-en-fr-v1-${{ runner.os }}

      - name: Installer traduction libre locale
        if: github.event_name != 'push'
        # Une panne de téléchargement ne doit pas casser la publication du site.
        continue-on-error: true
        env:
          ARGOS_PACKAGES_DIR: ${{ github.workspace }}/.argos-models
          ARGOS_DEVICE_TYPE: cpu
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-traduction.txt
          python scripts/install_translation.py

      - name: Collecter, synchroniser et enregistrer la veille
        if: github.event_name != 'push'
        env:
          ARGOS_PACKAGES_DIR: ${{ github.workspace }}/.argos-models
          ARGOS_DEVICE_TYPE: cpu
          ARGOS_COMPUTE_TYPE: int8
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Chaque tentative repart de la version la plus récente de main.
          # Cela rend les relances idempotentes et évite le rejet non-fast-forward.
          for tentative in 1 2 3; do
            echo "Tentative $tentative/3 — synchronisation avec main"
            git fetch --quiet origin main
            git checkout -B main origin/main
            python scripts/update.py
            git add data/veille.json
            if git diff --cached --quiet; then
              echo 'Aucun changement de données : publication inchangée.'
              break
            fi
            git commit -m "Veille : collecte automatique $(date -u +%F)"
            if git push origin HEAD:main; then
              echo 'Données mises à jour sur GitHub.'
              break
            fi
            if [ "$tentative" -eq 3 ]; then
              echo 'Impossible de synchroniser après trois tentatives.' >&2
              exit 1
            fi
            echo 'Une autre modification est intervenue : nouvelle synchronisation.'
            sleep 3
          done

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers du site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/veille.json _site/data/veille.json
          touch _site/.nojekyll

      - name: Créer le fichier de déploiement Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
